<!DOCTYPE html>

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Diogo - Moreira - Brasil</title>

<style>
* {
    margin: 0;
    padding: 0;
    box-sizing: border-box;
    font-family: 'arial,helvetica', sans-serif;
}    
body {
    background-color:#006633;
    color:white;
}
header {
    background-color:linear-gradient(90deg, #009739, #ffdf00, #002776);
    padding: 30px;
    text-align: center;
}
header h1 {
    font-size: 50px;
    text-shadow: 2px 3px 8px black;
}
header p {
    font-size: 20px;
}

.banner {
    height: 450px;
    background:url(images/banner.jpg) center/cover;
    display: flex;
    justify-content: center;
    align-items: center;
}

.banner h2 {
    font-size: 55px;
    background: rgba(0,0,0,.5);
    padding: 20px;
    border-radius: 20px;
}

section{
padding: 40px;    
}

h2 {
    color: #ffdf00;
    margin-bottom: 20px;
}

.galeria {
    display: grid;
    grid-template-columns: repeat(auto-fit, minmax(300px, 1fr));
    gap: 20px;
}

.galeria img {
    width: 100%;
    height: 250px;
    object-fit: cover;
    border-radius: 15px;
    border: 5px solid #ffdf00;
    transition: transform .4s;
}

.galeria img:hover {
    transform: scale(1.05);
}

.videos {
    display: grid;
    grid-template-columns: repeat(auto-fit, minmax(400px, 1fr));
    gap: 20px;
}

iframe {
    width: 100%;
    height: 250px;
    border-radius: 15px;
}

.bio {
    font-size: 20px;
    line-height: 1.8;
    background: #002776;
    padding: 20px;
    border-radius: 20px;
}

footer {
    background: black;
    padding:20px;
    text-align: center;
    margin-top: 30px;
}

</style>
</head>
<body>
